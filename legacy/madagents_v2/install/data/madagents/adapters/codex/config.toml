# MadAgents — Codex project config (.codex/config.toml)
# Orchestration settings for the MadAgents subagents in .codex/agents/.
# Note: project config applies in trusted projects; otherwise Codex uses its defaults.

[agents]
# Allow the orchestrator to run several workers/reviewers in parallel.
max_threads = 8
# Workers/reviewers do not themselves delegate, so a single level is enough.
max_depth = 1
