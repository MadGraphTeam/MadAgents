# Codex overrides — files whose *mechanism* differs, not just their paths.
#
# tools/render_codex.py path-substitutes everything else. These nine could not be
# substituted: a rewritten path would have left a sentence that parses and lies.
#
# Each entry pins the SHA-256 of the canonical file the override was written
# against. Edit the canonical file and the render FAILS until someone revisits
# the override. That is the point — an override is a fork, and a silently stale
# fork is how the two providers drift apart.
#
# After folding a canonical change into an override, refresh its hash:
#   python3 tools/refresh_override_hashes.py


