# opencode overrides — files whose *mechanism* differs, not just their paths.
#
# tools/render_opencode.py substitutes exactly one thing (CLAUDE.md -> AGENTS.md).
# It needs so little because the learned tier stays where Claude Code keeps it:
# every `.claude/agent-memory/<name>/MEMORY.md` sentence in the cards is still
# true here. What that leaves is ma-doctor — the skill whose *subject* is the
# harness — where a sentence can survive substitution and still be wrong.
#
# Note which of Codex's overrides are absent. ma-wiki-write, ma-reflect and
# mg-study needed forking there because a slate had to be spliced into a role
# file through a script. Here a slate is an ordinary markdown file at an
# ordinary path, so those three skills are shipped verbatim — the clearest
# measure of how much closer opencode sits to Claude Code.
#
# Each entry pins the SHA-256 of the canonical file the override was written
# against. Edit the canonical file and the render FAILS until someone revisits
# the override. That is the point — an override is a fork, and a silently stale
# fork is how the providers drift apart.
#
# After folding a canonical change into an override, refresh its hash:
#   python3 tools/refresh_override_hashes.py --manifest tools/opencode_overrides/OVERRIDES.toml


